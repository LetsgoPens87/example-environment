apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-application
  annotations:
    auto-update/image-updater/enabled: "true"
    auto-update/image-updater/strategy: "semver"  # or "latest"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example-application
  template:
    metadata:
      labels:
        app: example-application
    spec:
      containers:
      - name: example-application
        image: docker.io/dhricko9/example-application:v6.0.0
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: example-application
spec:
  type: LoadBalancer
  selector:
    app: example-application
  ports:
  - port: 8080